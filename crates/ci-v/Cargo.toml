[package]
name = "ci-v"

version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
description.workspace = true
license-file.workspace = true

[features]
default = ["std"]
std = ["alloc", "embedded-io/std", "thiserror/std"]
alloc = ["embedded-io/alloc"]

[dependencies]
embedded-io = { version = "0.7.1", default-features = false }
serialport = "4.10.1"
thiserror = { version = "2.0.21", default-features = false }

[dev-dependencies]
embedded-io-adapters = { version = "0.7", features = ["std"] }
